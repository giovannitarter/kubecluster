---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: ingress
spec:
  interval: 1h
  chart:
    spec:
      chart: traefik
      version: '41.*.*'
      sourceRef:
        kind: HelmRepository
        name: traefik-repo
        namespace: flux-system
      interval: 1h

  install:
    timeout: 5m

  upgrade:
    timeout: 5m

  values:

    ingressClass:
      enabled: false

    providers:
      kubernetesGateway:
        enabled: true
      kubernetesIngress:
        enabled: false

    api:
      dashboard: true
      insecure: true

    gateway:
      enabled: true

      name: traefik-gateway

      annotations:
        cert-manager.io/cluster-issuer: cloudflare-letsencrypt

      listeners:
        web:
          port: 80
          protocol: HTTP
          namespacePolicy:
            from: All

        websecure:
          hostname: "*.kube.pupillo.org"
          port: 443
          protocol: HTTPS
          namespacePolicy:
            from: All
          certificateRefs:
            - name: kube-pupillo-org-tls
          mode: Terminate

    ports:
      web:
        port: 80
        containerPort: 80
        exposedPort: 80
        expose:
          default: true

      websecure:
        port: 443
        containerPort: 443
        exposedPort: 443
        expose:
          default: true

    securityContext:
      capabilities:
        drop:
          - ALL
        add:
          - NET_BIND_SERVICE
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false

    service:
      spec:
        loadBalancerIP: "192.168.2.220"

    metrics:
      prometheus:
        enabled: true
