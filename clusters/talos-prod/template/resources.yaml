---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: {{ repo-name }}
  namespace: flux-system
spec:
  interval: 1h
  url: {{ repo-url }}

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: {{ release-name }}
  namespace:
spec:
  interval: 1m
  chart:
    spec:
      chart:
      version:
      sourceRef:
        kind: HelmRepository
        name: {{ repo-name }}
        namespace: flux-system
      interval: 5m

  install:
    timeout: 15m
