---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: {{ kustomization name }}
  namespace: flux-system

spec:

  interval: 5m
  path: "./clusters/talos-prod/{{ directory }}"
  prune: true
  wait: true

  sourceRef:
    kind: GitRepository
    name: flux-system

  dependsOn:

    - name: namespaces
      namespace: flux-system
