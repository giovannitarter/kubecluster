---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager
  namespace: flux-system

spec:

  interval: 5m
  path: "./clusters/talos-prod/infrastructure/cert-manager"
  prune: true
  wait: true

  sourceRef:
    kind: GitRepository
    name: flux-system

  dependsOn: []

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager-config
  namespace: flux-system

spec:

  interval: 5m
  path: "./clusters/talos-prod/infrastructure/cert-manager/config"
  prune: true
  wait: true

  sourceRef:
    kind: GitRepository
    name: flux-system

  decryption:
    provider: sops
    secretRef:
      name: sops-age

  dependsOn:
    - name: cert-manager
      namespace: flux-system
