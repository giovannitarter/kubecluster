---

apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: linstor
  namespace: flux-system
spec:
  interval: 5m
  path: "./clusters/talos-prod/linstor"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: namespaces
      namespace: flux-system
